<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400">
  <rect width="100%" height="100%" fill="#fffef6"/>
  <text x="40" y="60" font-size="26" fill="#222">Normal Purchase (curl)</text>
  <text x="40" y="110" font-size="16" fill="#333">$ curl -X POST -H "Content-Type: application/json" -d '{"productId":1,"quantity":1}' http://localhost:3000/purchase</text>
  <rect x="40" y="130" width="700" height="150" fill="#111827" rx="6"/>
  <text x="60" y="170" font-size="14" fill="#9ae6b4">{
  "success": true,
  "order": { "id": 1, "productId": 1, "quantity": 1, "amount": 100 },
  "balance": 900
}</text>
</svg>
